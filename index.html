<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>백은의 탐구자 채작 대비</title><style>
:root{--bg:#eef3f8;--fg:#14202c;--mute:#5c6b7a;--card:#fbfdff;--line:#cbd7e3;--acc:#2b6fa8;--new:#1d7a46}
@media (prefers-color-scheme:dark){:root{--bg:#0c141c;--fg:#e4edf5;--mute:#8a9bad;--card:#142230;--line:#263a4d;--acc:#8cc4ee;--new:#58c58a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 56px}h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:24px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}.m{color:var(--mute);font-size:12px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;border-bottom:1px solid var(--line)}
select,input,button{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}input[type=text],input:not([type]){flex:1;min-width:140px}
.cnt{color:var(--mute);font-size:12px;align-self:center}
table{width:100%;border-collapse:collapse;margin-top:8px}th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600}td.i{width:40px}img{width:32px;height:32px;display:block;border-radius:4px;background:var(--line)}
.n{font-weight:600}.tag{font-size:11px;font-weight:700}.new{color:var(--new)}.old{color:var(--acc)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
@media (max-width:640px){.hm{display:none}}
</style><style>
.snav{border-top:3px solid var(--acc);padding-top:8px;display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 14px;padding:0 0 8px;border-bottom:1px solid var(--line)}
.snav a{color:var(--mute);text-decoration:none;font-size:14px;padding:2px 0}
.snav a.on{color:var(--fg);font-weight:700;border-bottom:2px solid var(--fg)}
</style><style>.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;margin:6px 0;background:var(--card);border:1px solid var(--line);border-radius:6px;cursor:pointer}.ck input{margin-top:4px;width:16px;height:16px;padding:0}</style></head><body><main><nav class="snav"><a href="index.html" class=on>체크리스트</a><a href="guess.html">추리</a><a href="recipes.html">레시피</a><a href="materials.html">재료</a><a href="gathering.html">채집물</a><a href="gp.html">채집량</a></nav><h1>백은의 탐구자 채작 대비</h1><p class="sub">체크 상태는 이 브라우저에 저장됩니다. 백은 정보는 아직 없어서 재료 항목은 과거 패턴 기반 추리입니다.</p><div id="cl"></div><p><button id="reset">전체 해제</button> <span class="cnt" id="prog"></span></p></main><script>const CL=[["확장 전 기본 준비 (게임 내, 모든 확장 공통)", [["crys", "크리스탈 넉넉히 비축 (속성별 균형)", "황금 7.0: 91~95레벨 장비는 크리스탈 2종을 7개·8개씩, 96레벨 이상은 8개·8개씩. 백은 추측: 9개·8개 이상 (추리)"], ["scrip", "백색·자색 수집품 교환권 한도 확인 후 소진", "이전 대비 시트 기준. 현재 상한은 게임에서 확인"], ["leve", "리브 허용량 최대치(100) 맞추기", "이전 대비 시트 기준"], ["bi", "두 빛깔 보석 토큰 상한(1000) 확인", "이전 대비 시트 기준"], ["cust", "단골 거래·납품 소진", "이전 대비 시트 기준"], ["gc", "총사령부 납품 정리", "이전 대비 시트 기준"], ["food", "강장제·식사·약품 재고", "신규 확장 전 가격 변동 큼"], ["inv", "인벤토리·리테이너 정리, 빈 칸 확보", "신규 재료가 확장마다 약 120~185종 추가됨 (재료 페이지)"], ["tele", "텔레포 티켓·귀환 아이템 준비", ""], ["skill", "제작·채집 장비·스킬 점검, 만렙 장비 수리", ""]]], ["공개 정보 나오면 확인", [["pll", "마지막 프로듀서 레터 라이브(PLL) 확인", "전승록·신규 장비 시기 확인용"], ["fan", "팬 페스티벌 공개 지역·신규 직업·신규 기믹", "신규 직업이 있으면 무기 레시피가 x.0에 추가됨 (추리 페이지)"], ["lv", "레벨 캡·신규 레벨 구간 확인", "구간 번호가 맞아야 레시피 목록과 대조 가능"], ["rcp", "공개된 레시피와 추리 대조", "추리 페이지 항목의 등급 갱신"]]], ["재료 추리 (추리 페이지 기준, 확정 아님)", [["ore", "과거 광석 후보 확보: 몰리브덴·경금·휘취은 광석/모래, 경철·은 광석, 마그네시아 가루", "주괴 1개당 과거 광석 1개 패턴"], ["herb", "5능력 허브 5종 확인: 뜰냉이·빛거베라·라임바질·긴잎라벤더·참나리", "6.0·7.0에서 연속 사용, 세 번째는 불확실"], ["leath", "7.0 가죽 부자재 확인: 아까시나무 껍질 등", "하위 가죽 2~3종에서 직전 부자재 재사용 패턴"], ["cook", "요리 재료 재고: 꼬마레몬·고지대 밀가루·프란토이오 기름·크림버섯·피토마토·발효 버터", "과거 요리 재료 비중 증가 추세"], ["gath", "채집 연습: 한정 노드 전용 채집물, 최고 레벨 채집물 위치", "채집 페이지에서 확인"]]]];
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='evercold-checklist-v1';let st={};
try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function render(){let tot=0,done=0;
 $('cl').innerHTML=CL.map(([t,items])=>`<h2>${esc(t)}</h2>`+items.map(([id,name,note])=>{tot++;if(st[id])done++;
  return `<label class="ck"><input type="checkbox" data-id="${id}"${st[id]?' checked':''}><span><span class="n">${esc(name)}</span>${note?`<div class="m">${esc(note)}</div>`:''}</span></label>`}).join('')).join('');
 $('prog').textContent=done+' / '+tot;
 document.querySelectorAll('.ck input').forEach(i=>i.onchange=()=>{st[i.dataset.id]=i.checked;save();render()})}
$('reset').onclick=()=>{st={};save();render()};render();</script></body></html>
