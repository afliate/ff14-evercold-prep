const $=id=>document.getElementById(id);
const cats=[...new Set(D.map(r=>r.cat).filter(Boolean))].sort();
cats.forEach(c=>{const o=document.createElement('option');o.textContent=c;$('fc').appendChild(o)});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function url(p){return 'https://beta.xivapi.com/api/1/asset?path='+p+'_hr1.tex&format=png'}
function alt(p){const m=p.match(/icon\/(\d+)\/(\d+)/);return m?'https://xivapi.com/i/'+m[1]+'/'+m[2]+'.png':''}
window.fb=function(img){if(!img.dataset.t){img.dataset.t=1;img.src=img.dataset.alt}else img.removeAttribute('src')}
function render(){
 const s=$('fs').value,n=$('fn').value,r=$('fr').value,c=$('fc').value,q=$('q').value.trim();
 const rows=D.filter(x=>(!s||x.set===s)&&(n===''||String(x.new)===n)&&(!r||x.src===r)&&(!c||x.cat===c)&&(!q||x.name.includes(q)));
 $('cnt').textContent=rows.length+'개';
 $('tb').innerHTML=rows.map(x=>`<tr><td class="i"><img loading="lazy" src="${esc(url(x.icon))}" data-alt="${esc(alt(x.icon))}" onerror="fb(this)" alt=""></td><td><span class="n">${esc(x.name)}</span> <span class="tag ${x.new?'new':'old'}">${x.new?'신규':'재사용'}</span><div class="m">#${x.id}</div></td><td>${esc(x.patch)}<div class="m">${esc(x.origin)}</div></td><td class="hm">${esc(x.set)} ${esc(x.setver)}</td><td>${esc(x.src)}</td><td class="hm">${esc(x.cat)}</td><td class="hm">${x.glv===''?'':x.glv+(x.gstar?' ★'+x.gstar:'')}</td><td>${x.uses}</td></tr>`).join('');
}
['fs','fn','fr','fc'].forEach(i=>$(i).onchange=render);$('q').oninput=render;render();
</script></body></html>
